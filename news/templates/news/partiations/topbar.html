{% block topbar %}

<div class="container-fluid">
    <div class="row align-items-center bg-dark px-lg-5">
        <div class="col-12 col-md-8">
            <div class="d-flex justify-content-between">
                <div class="bg-primary text-white text-center py-2" style="width: 100px;"><b>اخبار ترند</b></div>
                <div class="owl-carousel owl-carousel-1 tranding-carousel position-relative d-inline-flex align-items-center ml-3" style="width: calc(100% - 100px); padding-left: 90px;">
                    {% for post in navbar_new_posts %}
                    <div class="text-truncate"><a class="text-secondary" href="{% url "news:detail" post.id post.about.name %}"><b style="color:white">{{post.title}}</b></a></div>
                    {% endfor %}
                </div>
            </div>
        </div>
        <div class="col-md-4 text-right d-none d-md-block" style="color:white">
            ساخته شده توسط سورنا کمری
              |  Made by <b>Surena Kamari</b>
        </div>
    </div>
    <div class="row align-items-center py-2 px-lg-5">
        <div class="col-lg-4">
            <a href="" class="navbar-brand d-none d-lg-block">
                <h1 class="m-0 display-5 text-uppercase"><span class="text-primary">Surena</span>News</h1>
            </a>
        </div>
        <div class="col-lg-8 text-center text-lg-right">
            <img class="img-fluid" src="img/ads-700x70.jpg" alt="">
        </div>
    </div>
</div>


{% endblock topbar %}
